# Frontend CI — the web-portal quality gates (roadmap Phase 1):
# format check, typecheck, lint (incl. import boundaries), tests, build.
# Runs only when web-portal changes; the backend keeps its own ci.yml.
name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['web-portal/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['web-portal/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Contrast · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # jsdom cannot run axe's colour-contrast rule, so the ratios are verified
      # from the token file directly (scripts/check-contrast.mjs).
      - name: Contrast (WCAG 2.2 AA, both themes)
        run: npm run check:contrast

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
