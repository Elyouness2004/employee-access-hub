# Enterprise CI — every push/PR to main builds, tests, and passes the quality
# gates (JaCoCo ratchet, SpotBugs, Checkstyle) before Docker images are built.
# No deployment here: delivery is cd.yml's job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: JaCoCo report + coverage ratchet
        run: ./mvnw -B -ntp -DskipTests jacoco:report jacoco:check

      - name: SpotBugs
        run: ./mvnw -B -ntp -DskipTests spotbugs:check

      - name: Checkstyle
        run: ./mvnw -B -ntp -DskipTests checkstyle:check

      - name: Package
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload application jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            gateway/target/*.jar
            services/*/target/*.jar
          retention-days: 14

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            gateway/target/surefire-reports/
            services/*/target/surefire-reports/
            gateway/target/site/jacoco/
            services/*/target/site/jacoco/
          retention-days: 14

  docker:
    name: Docker image · ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: gateway,           context: gateway }
          - { module: hr-service,        context: services/hr-service }
          - { module: leave-service,     context: services/leave-service }
          - { module: expense-service,   context: services/expense-service }
          - { module: documents-service, context: services/documents-service }
          - { module: analytics-service, context: services/analytics-service }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build-only on CI (no registry push — that is the CD pipeline's job);
      # proves every Dockerfile stays buildable and correctly layered.
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="0.1.0-${GITHUB_SHA::7}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${{ matrix.module }}:${GITHUB_SHA::7}" \
            "${{ matrix.context }}"

  badges:
    name: Generate badges
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports

      - name: Generate JaCoCo coverage badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          badges-directory: badges
          jacoco-csv-file: >
            reports/gateway/target/site/jacoco/jacoco.csv
            reports/services/hr-service/target/site/jacoco/jacoco.csv
            reports/services/leave-service/target/site/jacoco/jacoco.csv
            reports/services/expense-service/target/site/jacoco/jacoco.csv
            reports/services/documents-service/target/site/jacoco/jacoco.csv
            reports/services/analytics-service/target/site/jacoco/jacoco.csv

      - name: Upload badges
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: badges/
          retention-days: 14
