server:
  port: 9002

spring:
  application:
    name: leave-service
  # trace context propagates across RabbitMQ (Phase 7); no effect until the
  # broker adapter is enabled (hub.events.rabbit.enabled)
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  datasource:
    # H2 in PostgreSQL mode by default so `mvnw test` and e2e-local.sh work
    # without Docker; compose overrides these with the real PostgreSQL.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:leave;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: leave
  flyway:
    create-schemas: true
    default-schema: leave
    schemas: leave
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer as it appears in tokens (host-facing URL)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/employee-hub}
          # optional override for container networking (keys fetched internally,
          # issuer claim still validated against issuer-uri)
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:}
  cloud:
    openfeign:
      client:
        config:
          hr-service:
            connect-timeout: 2000
            read-timeout: 2000

hub:
  security:
    audience: hub-api
  hr:
    base-url: ${HR_SERVICE_URI:http://localhost:9001}
    # manager-relationship cache (§2.5): fresh snapshots avoid an HR call per
    # request; stale snapshots are served ONLY while hr-service is unreachable.
    # Both windows are the documented staleness trade-off.
    snapshot-cache-ttl: 10m
    stale-snapshot-ttl: 24h
    circuit-breaker:
      sliding-window-size: 10
      minimum-number-of-calls: 4
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
  leave:
    # annual allocation provisioned on first use; HR can adjust per employee
    default-annual-days: 25

  # Cross-context event fabric (Part 4). This context binds its own queue on the
  # shared employee.events exchange to react to hr-service's employee lifecycle
  # (offboarding close-out). OFF by default: the synchronous fan-out from
  # hr-service is the primary path and needs no broker; the consumer is the
  # recovery path for when that call could not be made.
  events:
    rabbit:
      enabled: ${HUB_EVENTS_RABBIT_ENABLED:false}
      exchange: employee.events

management:
  # per-service tag so Prometheus/Grafana can slice metrics by application
  metrics:
    tags:
      application: ${spring.application.name}
  # Distributed tracing (Phase 7). Sampling defaults to 0.0 so tests and the dev
  # stack create/export nothing; the observability overlay and staging/production
  # raise it and point OTLP at Tempo.
  tracing:
    sampling:
      probability: ${HUB_TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        # prometheus + metrics scraped on the backend network only (not routed
        # by the gateway, not publicly reachable)
        include: health,info,prometheus,metrics
  health:
    # the AMQP starter is on the classpath for the gated consumer; never probe a
    # broker that is not configured (would make /actuator/health flap)
    rabbit:
      enabled: false
