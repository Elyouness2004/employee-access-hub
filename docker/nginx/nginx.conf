# nginx main config for the Employee Access Hub edge (Phase 9). TLS terminates
# here (the only public entry); it proxies to the gateway and Keycloak on the
# internal network. Server blocks are rendered from templates/ (envsubst) into
# conf.d/ at container start.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                       # do not leak the nginx version

    # access log carries the correlation id for cross-tier tracing
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cid=$http_x_correlation_id';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # --- request / upload limits ---
    client_max_body_size      10m;           # cap uploads (documents service)
    client_body_timeout       15s;
    client_header_timeout     15s;
    large_client_header_buffers 4 16k;

    # --- compression ---
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        application/json application/javascript text/css text/plain application/xml;

    # --- trusted proxies / real client IP (docker private ranges only) ---
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # --- rate limiting (keyed on the real client IP) ---
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=auth:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr  zone=conns:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # --- shared proxy settings ---
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    include /etc/nginx/conf.d/*.conf;        # rendered from templates/
}
