# Promtail: discovers every container via the Docker socket and ships its logs to
# Loki, labelled by compose service. The services emit JSON in staging/production
# (logback-spring.xml), so the JSON pipeline lifts level/application/correlationId/
# traceId into labels for correlation in Grafana.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
    pipeline_stages:
      # parse the JSON emitted by the Java services (no-op for non-JSON lines
      # like postgres/keycloak, which still ship with their container/service labels)
      - json:
          expressions:
            level: level
            application: application
            correlationId: correlationId
            traceId: traceId
      - labels:
          level:
          application:
