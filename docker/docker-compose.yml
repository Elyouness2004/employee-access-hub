name: employee-access-hub

# Shared hardening for the six first-party Java services: immutable root FS
# (Spring Boot only writes /tmp — tmpfs), all Linux capabilities dropped, no
# privilege escalation, an init process for signal/zombie handling, and a
# memory ceiling the JVM derives its heap from (-XX:MaxRAMPercentage=75).
x-service-hardening: &service-hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  mem_limit: 512m
  mem_reservation: 256m
  cpus: 1.0

networks:
  edge:
  backend:

volumes:
  pgdata:
  rabbitmqdata:
  # uploaded document blobs — the only writable path in an otherwise read-only
  # documents-service container (metadata stays in PostgreSQL)
  documentsdata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      HR_DB_PASSWORD: ${HR_DB_PASSWORD:?set in .env}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD:?set in .env}
      EXPENSE_DB_PASSWORD: ${EXPENSE_DB_PASSWORD:?set in .env}
      DOCUMENTS_DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs on first initialization of pgdata only (see script header)
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    # entrypoint starts as root and steps down via gosu — keep only the caps
    # that chown/setuid dance needs; memory sized for 5 small databases
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      # Canonical browser-facing base URL for this realm. Without it Keycloak
      # builds links from the request Host header, so the password-reset action
      # token mailed on hr-service's behalf came out as http://keycloak:8080/...
      # — the compose-internal name, which no browser can resolve. Must match the
      # host part of KEYCLOAK_ISSUER_URI.
      KC_FRONTEND_URL: ${KC_FRONTEND_URL:-http://localhost:8081}
      # Realm import resolves ${VAR} placeholders from THIS container's environment
      # (verified against Keycloak 26.3: ${VAR} and ${VAR:default} resolve, ${env.VAR}
      # does not). The hr-provisioner client secret therefore lives only in .env —
      # never in the committed realm file — and must match hr-service's copy below.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in .env}
      # SMTP for Keycloak's native account e-mails (password setup / reset action
      # tokens). Defaults target the `mailpit` dev sink started by `--profile mail`;
      # point them at a real relay for staging/production. Never commit credentials.
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@hub.local}
      KC_SMTP_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-Employee Access Hub}
      KC_SMTP_REPLY_TO: ${KC_SMTP_REPLY_TO:-no-reply@hub.local}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
    volumes:
      - ../keycloak-config:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"   # host-facing: issuer URL uses this port
    networks: [backend]
    # image runs entirely as the non-root keycloak user — no caps needed;
    # Keycloak is the memory-hungriest container in the stack
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # management port 9000; image ships no curl — use bash /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Event fabric broker (Part 4). Present in the stack, but hr-service only
  # publishes to it when HUB_EVENTS_RABBIT_ENABLED=true (default off: events are
  # written to the transactional outbox regardless).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [backend]
    # same root-then-gosu entrypoint pattern as postgres — same minimal cap set
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # DEV-ONLY SMTP sink for Keycloak's account e-mails (password setup / reset).
  # Opt-in: `docker compose --profile mail up -d` — the default stack is unchanged.
  # It captures mail instead of delivering it, so the activation flow is testable
  # locally without a relay and without mail ever leaving the machine. Never enable
  # this profile in staging or production; point KC_SMTP_* at the real relay there.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [mail]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"   # web UI: http://localhost:8025 — read the activation link here
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  hr-service:
    build: ../services/hr-service
    <<: *service-hardening
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/employee-hub}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/employee-hub/protocol/openid-connect/certs}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hr
      SPRING_DATASOURCE_USERNAME: hr
      SPRING_DATASOURCE_PASSWORD: ${HR_DB_PASSWORD:?set in .env}
      # offboarding fan-out targets (P3.3): token-relayed calls to the consumers
      LEAVE_SERVICE_URI: http://leave-service:9002
      EXPENSE_SERVICE_URI: http://expense-service:9003
      DOCUMENTS_SERVICE_URI: http://documents-service:9004
      # identity provisioning (P3.2). Off by default; set the flag + a
      # least-privilege service account (KEYCLOAK_ADMIN_CLIENT_*) to enable.
      HUB_IDENTITY_KEYCLOAK_ENABLED: ${HUB_IDENTITY_KEYCLOAK_ENABLED:-false}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: employee-hub
      # hr-provisioner is declared IN the employee-hub realm, so its token comes
      # from that realm — not from `master`. Without this the adapter would ask
      # master for a token the client does not have (the old Gap-2 footgun).
      KEYCLOAK_TOKEN_REALM: ${KEYCLOAK_TOKEN_REALM:-employee-hub}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-hr-provisioner}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in .env}
      # Account activation / password setup: Keycloak's own execute-actions-email
      # (action token → its password form). No password ever leaves this service.
      HUB_IDENTITY_ACTIVATION_ENABLED: ${HUB_IDENTITY_ACTIVATION_ENABLED:-true}
      HUB_IDENTITY_ACTIVATION_CLIENT_ID: ${HUB_IDENTITY_ACTIVATION_CLIENT_ID:-web-portal}
      HUB_IDENTITY_ACTIVATION_REDIRECT_URI: ${HUB_IDENTITY_ACTIVATION_REDIRECT_URI:-http://localhost:5173/}
      # event relay + RabbitMQ (Part 4). Off by default (outbox only).
      HUB_EVENTS_RELAY_ENABLED: ${HUB_EVENTS_RELAY_ENABLED:-false}
      HUB_EVENTS_RABBIT_ENABLED: ${HUB_EVENTS_RABBIT_ENABLED:-false}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-hub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
    networks: [backend]   # internal only — reachable exclusively through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9001 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  leave-service:
    build: ../services/leave-service
    <<: *service-hardening
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/employee-hub}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/employee-hub/protocol/openid-connect/certs}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leave
      SPRING_DATASOURCE_USERNAME: leave
      SPRING_DATASOURCE_PASSWORD: ${LEAVE_DB_PASSWORD:?set in .env}
      # cross-context event consumer (Part 4): binds employee.events.leave and
      # applies the offboarding close-out. Off by default, like hr-service's relay.
      HUB_EVENTS_RABBIT_ENABLED: ${HUB_EVENTS_RABBIT_ENABLED:-false}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-hub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      # token-relay target for the manager/employee lookup (§2.5)
      HR_SERVICE_URI: http://hr-service:9001
    networks: [backend]   # internal only — reachable exclusively through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      hr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9002 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  expense-service:
    build: ../services/expense-service
    <<: *service-hardening
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/employee-hub}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/employee-hub/protocol/openid-connect/certs}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense
      SPRING_DATASOURCE_USERNAME: expense
      SPRING_DATASOURCE_PASSWORD: ${EXPENSE_DB_PASSWORD:?set in .env}
      # cross-context event consumer (Part 4): binds employee.events.expense and
      # applies the offboarding close-out. Off by default, like hr-service's relay.
      HUB_EVENTS_RABBIT_ENABLED: ${HUB_EVENTS_RABBIT_ENABLED:-false}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-hub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      # token-relay target for the manager snapshot (§2.5), same as leave
      HR_SERVICE_URI: http://hr-service:9001
    networks: [backend]   # internal only — reachable exclusively through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      hr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9003 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  documents-service:
    build: ../services/documents-service
    <<: *service-hardening
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/employee-hub}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/employee-hub/protocol/openid-connect/certs}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/documents
      SPRING_DATASOURCE_USERNAME: documents
      SPRING_DATASOURCE_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?set in .env}
      # cross-context event consumer (Part 4): binds employee.events.documents and
      # applies the offboarding close-out. Off by default, like hr-service's relay.
      HUB_EVENTS_RABBIT_ENABLED: ${HUB_EVENTS_RABBIT_ENABLED:-false}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-hub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      # uploaded files live on the volume below, never in the database
      HUB_DOCUMENTS_STORAGE_ROOT: /var/lib/hub/documents
      HUB_DOCUMENTS_MAX_FILE_SIZE: ${HUB_DOCUMENTS_MAX_FILE_SIZE:-10MB}
    volumes:
      - documentsdata:/var/lib/hub/documents
    networks: [backend]   # internal only — reachable exclusively through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9004 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  analytics-service:
    build: ../services/analytics-service
    <<: *service-hardening
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/employee-hub}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/employee-hub/protocol/openid-connect/certs}
      # READ-ONLY aggregator: no database, only the sources' internal REST APIs
      HR_SERVICE_URI: http://hr-service:9001
      LEAVE_SERVICE_URI: http://leave-service:9002
      EXPENSE_SERVICE_URI: http://expense-service:9003
      DOCUMENTS_SERVICE_URI: http://documents-service:9004
    networks: [backend]   # internal only — reachable exclusively through the gateway
    depends_on:
      keycloak:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      documents-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9005 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  gateway:
    build: ../gateway
    <<: *service-hardening
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/employee-hub}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/employee-hub/protocol/openid-connect/certs}
      HR_SERVICE_URI: http://hr-service:9001
      LEAVE_SERVICE_URI: http://leave-service:9002
      EXPENSE_SERVICE_URI: http://expense-service:9003
      DOCUMENTS_SERVICE_URI: http://documents-service:9004
      ANALYTICS_SERVICE_URI: http://analytics-service:9005
    ports:
      - "8080:8080"
    networks: [edge, backend]
    depends_on:
      hr-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      documents-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
