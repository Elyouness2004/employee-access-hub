# Staging profile (SPRING_PROFILES_ACTIVE=staging): mirrors production
# behavior — graceful shutdown, fail-fast required env — with verbose hub
# logging for pre-production debugging. Business config stays in application.yml.
server:
  shutdown: graceful
  # behind the nginx TLS proxy (Phase 9): honor X-Forwarded-* so the
  # gateway sees the real scheme/host/client IP
  forward-headers-strategy: native

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                # no default on purpose: staging must declare its real origins
                allowedOrigins: ${HUB_CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.hub: DEBUG

management:
  endpoint:
    health:
      probes:
        enabled: true
