server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/employee-hub}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # one route per business service. Internal /internal/** APIs are
            # deliberately not routed — they are reachable only on the backend
            # network. The analytics route also fronts the Power BI facade
            # (/api/analytics/powerbi/**).
            - id: hr-service
              uri: ${HR_SERVICE_URI:http://localhost:9001}
              predicates:
                - Path=/api/hr/**
            - id: leave-service
              uri: ${LEAVE_SERVICE_URI:http://localhost:9002}
              predicates:
                - Path=/api/leave/**
            - id: expense-service
              uri: ${EXPENSE_SERVICE_URI:http://localhost:9003}
              predicates:
                - Path=/api/expenses/**
            - id: documents-service
              uri: ${DOCUMENTS_SERVICE_URI:http://localhost:9004}
              predicates:
                - Path=/api/documents/**
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URI:http://localhost:9005}
              predicates:
                - Path=/api/analytics/**
          globalcors:
            cors-configurations:
              '[/**]':
                # env-driven so staging/production can pin real origins; the
                # default keeps the local SPA dev servers working unchanged
                allowedOrigins: ${HUB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type, X-Correlation-Id]
                # Content-Disposition is exposed so a browser client can read the
                # filename off a document download; without it the SPA can fetch
                # the bytes but not name the file it saves
                exposedHeaders: [X-Correlation-Id, Content-Disposition]
                maxAge: 3600

hub:
  security:
    audience: hub-api

management:
  # per-service tag so Prometheus/Grafana can slice metrics by application
  metrics:
    tags:
      application: ${spring.application.name}
  # Distributed tracing (Phase 7). Sampling defaults to 0.0 so tests and the dev
  # stack create/export nothing; the observability overlay and staging/production
  # raise it and point OTLP at Tempo.
  tracing:
    sampling:
      probability: ${HUB_TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        # prometheus + metrics scraped on the backend network only (not routed
        # by the gateway, not publicly reachable)
        include: health,info,prometheus,metrics
